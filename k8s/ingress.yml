apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: blog-app

spec:
  ingressClassName: nginx
  rules: 
    - host: blog-app.local
      http:
        paths:   
         - path: /
           pathType: Prefix
           backend:
             service:
               name: web-svc
               port:
                 number: 8000
                