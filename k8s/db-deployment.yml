apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: blog-app
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres-db-container
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        volumeMounts:
         - name: postgres-data
           mountPath: /var/lib/postgresql/data
        envFrom:
        - secretRef:
            name: postgres-secrets
      volumes:
       - name: postgres-data
         persistentVolumeClaim:
           claimName: postgres-pvc