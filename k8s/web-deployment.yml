apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: blog-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: web-container
        image: aliahmadshah/blog-app-web:latest
        imagePullPolicy: IfNotPresent
        # trivy fs
        # Container-level security context
        securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        ports:
        - containerPort: 8000 
        envFrom:
        - configMapRef:
            name: web-configmap
        - secretRef:
            name: web-secret
        # volumeMounts:
        # - name: static-volume
        #   mountPath: /app/static

        # trivy fs
        volumeMounts:
          - name: web-static
            mountPath: /app/static
          - name: web-tmp
            mountPath: /tmp
      # volumes:
      # - name: static-volume
      #   persistentVolumeClaim:
      #     claimName: web-pvc

      # trivy fs

      volumes:
         - name: web-static
           persistentVolumeClaim:
            claimName: web-pvc
         - name: web-tmp
           emptyDir: {}
